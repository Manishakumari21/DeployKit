services:
  postgres:
    image: postgres:18-alpine
    container_name: deploykit-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - deploykit-db:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile

    container_name: deploykit-api

    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}

    ports:
      - "3001:3000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile

    container_name: deploykit-web

    ports:
      - "8081:80"

    depends_on:
      api:
        condition: service_healthy

    networks:
      - default

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile

    container_name: deploykit-worker
    command: ["node", "dist/workers/deploymentWorker.js"]

    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      DEPLOYMENT_WORKER_ENABLED: "true"
      WORKER_POLL_INTERVAL_MS: 2000
      WORKER_LEASE_MS: 30000
      DEPLOYKIT_RUNTIME_NETWORK: deploykit-runtime
      DEPLOYKIT_BUILDER_NAME: deploykit-builder
      DEPLOYKIT_ALLOWED_GIT_HOSTS: github.com
      DEPLOYKIT_GATEWAY_CONTAINER: dk-gateway
      DEPLOYKIT_GATEWAY_ROUTES_DIR: /gateway-routes
      DEPLOYKIT_GATEWAY_HOST: dk-gateway
      DEPLOYKIT_REGISTRY_HOST: ${DEPLOYKIT_REGISTRY_HOST:-}
      DEPLOYKIT_REGISTRY_NAMESPACE: ${DEPLOYKIT_REGISTRY_NAMESPACE:-deploykit}
      DEPLOYKIT_REGISTRY_INSECURE: ${DEPLOYKIT_REGISTRY_INSECURE:-false}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}

    volumes:
      # Worker only: Buildx and runtime need Docker access.
      # Never mount the socket into api/web (public surface).
      - /var/run/docker.sock:/var/run/docker.sock
      - deploykit-gateway-routes:/gateway-routes

    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      registry:
        condition: service_healthy

    networks:
      - default
      - runtime

  registry:
    # Pinned to registry:2.8.3 (2.x line): mature, stable /v2/ API,
    # OCI-compatible, minimal surface. Pinned by patch to avoid
    # `latest` drift. Development-only: unauthenticated, internal
    # network only, no host ports published by default.
    image: registry:2.8.3
    container_name: deploykit-registry

    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry

    volumes:
      - deploykit-registry-data:/var/lib/registry

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:5000/v2/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - default

  gateway:
    build:
      context: ./ops/gateway
      dockerfile: Dockerfile

    container_name: dk-gateway

    volumes:
      - deploykit-gateway-routes:/etc/nginx/routes

    networks:
      - runtime

networks:
  default:
    name: deploykit-default
    driver: bridge
  runtime:
    name: deploykit-runtime
    driver: bridge

volumes:
  deploykit-db:
  deploykit-gateway-routes:
  deploykit-registry-data: