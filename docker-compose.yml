services:
  postgres:
    image: postgres:18-alpine
    container_name: deploykit-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - deploykit-db:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile

    container_name: deploykit-api

    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEPLOYKIT_ALLOW_PUBLIC_REGISTRATION: "false"
      DEPLOYKIT_TOKEN_PEPPER: ${DEPLOYKIT_TOKEN_PEPPER:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}

    ports:
      - "3001:3000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile

    container_name: deploykit-web

    ports:
      - "8081:80"

    depends_on:
      api:
        condition: service_healthy

    networks:
      - default

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker

    container_name: deploykit-worker
    command: ["node", "dist/workers/deploymentWorker.js"]

    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEPLOYMENT_WORKER_ENABLED: "true"
      WORKER_POLL_INTERVAL_MS: 2000
      WORKER_LEASE_MS: 30000
      DEPLOYKIT_RUNTIME_NETWORK: deploykit-runtime
      DEPLOYKIT_BUILDER_NAME: deploykit-builder
      BUILDX_CONFIG: /tmp/deploykit-buildx
      DEPLOYKIT_ALLOWED_GIT_HOSTS: github.com
      DEPLOYKIT_GATEWAY_CONTAINER: dk-gateway
      DEPLOYKIT_GATEWAY_ROUTES_DIR: /gateway-routes
      DEPLOYKIT_GATEWAY_HOST: dk-gateway
      DEPLOYKIT_REGISTRY_HOST: ${DEPLOYKIT_REGISTRY_HOST:-deploykit-registry-tls:443}
      DEPLOYKIT_REGISTRY_NAMESPACE: ${DEPLOYKIT_REGISTRY_NAMESPACE:-deploykit}
      DEPLOYKIT_REGISTRY_INSECURE: ${DEPLOYKIT_REGISTRY_INSECURE:-false}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      DEPLOYKIT_CERTS_DIR: /certs
      DEPLOYKIT_ACME_EMAIL: ${DEPLOYKIT_ACME_EMAIL:-}
      DEPLOYKIT_ACME_SERVER: ${DEPLOYKIT_ACME_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
      DEPLOYKIT_TLS_MODE: ${DEPLOYKIT_TLS_MODE:-acme}
      DEPLOYKIT_CERT_POLL_INTERVAL_MS: ${DEPLOYKIT_CERT_POLL_INTERVAL_MS:-60000}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deploykit-gateway-routes:/gateway-routes
      - deploykit-certs:/certs
      - deploykit-buildx-state:/tmp/deploykit-buildx

    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      registry:
        condition: service_healthy

    networks:
      - default
      - runtime

  edge-agent:
    profiles: ["edge"]

    build:
      context: ./apps/api
      dockerfile: Dockerfile.agent

    container_name: deploykit-edge-agent

    environment:
      DEPLOYKIT_CONTROL_PLANE_URL: ${DEPLOYKIT_EDGE_CONTROL_PLANE_URL:-http://api:3000}
      DEPLOYKIT_EDGE_ALLOW_HTTP: ${DEPLOYKIT_EDGE_ALLOW_HTTP:-true}
      DEPLOYKIT_AGENT_TOKEN: ${DEPLOYKIT_AGENT_TOKEN:-}
      DEPLOYKIT_AGENT_ID: ${DEPLOYKIT_AGENT_ID:-}
      DEPLOYKIT_EDGE_POLL_INTERVAL_MS: 5000
      DEPLOYKIT_EDGE_REQUEST_TIMEOUT_MS: 15000
      DEPLOYKIT_EDGE_NETWORK: deploykit-runtime
      DEPLOYKIT_LOG_LEVEL: ${DEPLOYKIT_LOG_LEVEL:-info}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      api:
        condition: service_healthy

    networks:
      - default
      - runtime


  registry:
    image: registry:2.8.3
    container_name: deploykit-registry

    ports:
      - "127.0.0.1:5000:5000"

    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry

    volumes:
      - deploykit-registry-data:/var/lib/registry

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:5000/v2/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - default

  gateway:
    build:
      context: ./ops/gateway
      dockerfile: Dockerfile

    container_name: dk-gateway

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - deploykit-gateway-routes:/etc/nginx/routes
      - deploykit-certs:/etc/nginx/certs:ro

    networks:
      default:
        aliases:
          - deploykit-registry-tls
      runtime: {}

networks:
  default:
    name: deploykit-default
    driver: bridge
  runtime:
    name: deploykit-runtime
    driver: bridge

volumes:
  deploykit-db:
  deploykit-gateway-routes:
  deploykit-registry-data:
  deploykit-buildx-state:
  deploykit-certs: