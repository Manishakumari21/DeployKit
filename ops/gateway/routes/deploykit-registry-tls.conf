server {
    listen 443 ssl;
    server_name deploykit-registry-tls;

    ssl_certificate /etc/nginx/certs/deploykit-registry-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/deploykit-registry-tls/private-key.pem;

    # Registry operations can push large layers; disable buffering and
    # raise the body limit to avoid truncating uploads through the gateway.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://registry:5000;
        proxy_set_header Host $host;
        # Tell the registry that the client connection was TLS-terminated by
        # Nginx so generated upload Location URLs use https:// and remain on
        # the registry TLS route instead of falling back to HTTP port 80.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
